name: OptiSchedule CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: Unit Tests, Coverage & Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies for Qt Headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov mutmut

      - name: Run Pytest with Code Coverage (Offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ --cov=app --cov-report=xml:coverage.xml --cov-report=term -v

      - name: Run Mutation Testing (mutmut)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          echo "Executing mutation analysis on core optimization and auth modules..."
          python scripts/run_mutation_tests.py --threshold 50
