# SonarCloud Project Configuration for OptiSchedule UMB
sonar.projectKey=vranfe_optischedule
sonar.organization=vranfe
sonar.projectName=OptiSchedule-UMB
sonar.projectVersion=1.0.0

# Paths to source code and tests
sonar.sources=app
sonar.tests=tests

# Coverage reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.11,3.12,3.13,3.14

# Exclusions
sonar.exclusions=**/__pycache__/**,data/**,dist/**,build/**,*.spec,scripts/**
sonar.test.inclusions=tests/**/test_*.py

# Encoding
sonar.sourceEncoding=UTF-8
